[package]
name = "codexpet"
version = "2.2.0"
edition = "2024"
description = "A native Windows desktop pet that follows Codex activity"
publish = false

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[build-dependencies]
embed-resource = "3.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
self-replace = "1.5"
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
  "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell",
  "Win32_Globalization", "Win32_Networking_WinHttp", "Win32_UI_Input_KeyboardAndMouse"
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "CodexPet"
path = "src/main.rs"
